<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Copilote Stratégique — pilotage stratégique des projets et talents" />
        <meta name="theme-color" content="#0F6E56" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&family=JetBrains+Mono:wght@400..600&family=Space+Grotesk:wght@500;600;700&display=swap"
            rel="stylesheet"
        />

        <title>Copilote Stratégique</title>
    </head>

    <body class="min-h-dvh w-full bg-primary antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
        <script>
            // On page load — Deep Ops sombre = vitrine si aucune préférence
            (function () {
                var stored = localStorage.getItem("ui_theme") || localStorage.getItem("theme");
                var dark = false;
                if (stored === "light") dark = false;
                else if (stored === "dark") dark = true;
                else if (stored === "system") dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                else dark = true;
                document.documentElement.classList.toggle("dark-mode", dark);
            })();
        </script>
    </body>
</html>
